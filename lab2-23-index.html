<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 20px auto;
            max-width: 900px;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        
        h1, h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        h1 {
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-top: 0;
        }
        
        .resume-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .resume-table th, .resume-table td {
            border: 1px solid #ddd;
            padding: 12px 15px;
            vertical-align: top;
        }
        
        .resume-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            width: 20%;
        }
        
        .section-title {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            text-align: left;
        }
        
        ol {
            padding-left: 20px;
            margin: 0;
        }
        
        ol li {
            margin: 8px 0;
            padding-left: 5px;
        }
        
        .icon {
            color: #3498db;
            margin-right: 8px;
        }
        
        .自我评价 {
            text-align: justify;
        }
        
        .table-caption {
            caption-side: top;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
    </style>
</head>
<body>
    <h1>个人简历</h1>
    
    <table class="resume-table" caption="基本信息" class="table-caption">
        <tr>
            <th>姓名</th>
            <td colspan="3">董天逸</td>
            <th rowspan="4">
            <img src="photo1.jpg"
            alt="个人照片"
            style="width: 150px;height: auto;border-radius: 8px;"
            </th>
        </tr>
        <tr>
            <th>性别</th>
            <td>男</td>
            <th>年龄</th>
            <td>19</td>
        </tr>
        <tr>
            <th>学历</th>
            <td>本科</td>
            <th>专业</th>
            <td>计算机科学与技术</td>
        </tr>
        <tr>
            <th>联系电话</th>
            <td>18863819890</td>
            <th>邮箱</th>
            <td>226815820@qq.com</td>
        </tr>
    </table>
    
    <table class="resume-table">
        <tr>
            <th class="section-title" colspan="5">项目经历</th>
        </tr>
        <tr>
            <th>时间</th>
            <td colspan="4">2025年</td>
        </tr>
        <tr>
    </table>
    
    <table class="resume-table">
        <tr>
            <th class="section-title" colspan="5">技能证书</th>
        </tr>
    </table>
    
    <table class="resume-table">
        <tr>
            <th class="section-title" colspan="5">兴趣爱好</th>
        </tr>
        <tr>
            <td colspan="5">
                <ol>
                    <li><i class="fas fa-sport icon"></i>体育：排球，篮球，羽毛球等运动，热衷于锻炼身体</li>
                    <li><i class="fas fa-book icon"></i>阅读：主要阅读小说等</li>

                </ol>
            </td>
        </tr>
    </table>
    
    <table class="resume-table">
        <tr>
            <th class="section-title" colspan="5">自我评价</th>
        </tr>
        <tr>
            <td colspan="5" class="自我评价">
                我是计算机科学与计算的一名学生，热衷于学习专业知识，同时对生活充满热情，喜欢参加体育活动和志愿活动。喜欢在课余时间提升自己，我喜欢读国内外的各种小说来丰富自己的见识和内涵。喜欢参与体育活动来锻炼身体，热爱打篮球，羽毛球等体育活动并参与排球院队。希望能在大学生活中丰富多彩，充实自己。
            </td>
        </tr>
    </table>
</body>
</html>
